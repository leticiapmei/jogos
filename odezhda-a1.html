<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Одежда – слова и фразы (A1+)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAF9F5;--fg:#141414;--card:#fff;--muted:#5d5b55;--caju:#E8452C;--sun:#F5B820;--blue:#1F46A8;--leaf:#1E7F55;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161513;--fg:#F4F1EA;--card:#1f1e1b;--muted:#a9a69d}}
:root[data-theme="dark"]{--bg:#161513;--fg:#F4F1EA;--card:#1f1e1b;--muted:#a9a69d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font:500 18px/1.4 Jost,Futura,"Trebuchet MS",sans-serif}
main{max-width:860px;margin:0 auto;padding:20px 18px 48px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
h1,h2,h3,p{margin:0}
.brand{display:flex;justify-content:space-between;align-items:center;font-weight:800;letter-spacing:.02em}
.brand span:last-child{font-weight:500;color:var(--muted)}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;margin:18px 0 22px}
.hero h1{font-size:clamp(56px,15vw,128px);font-weight:800;letter-spacing:-.035em;line-height:.95}
.hero p{font-size:20px;color:var(--muted);margin-top:10px;max-width:30ch}
.art{width:clamp(150px,30vw,230px);flex:none}
.art>*{transform-box:fill-box;transform-origin:center}
@media (prefers-reduced-motion:no-preference){.art>*{animation:drop .7s cubic-bezier(.2,.8,.3,1) backwards}.art>:nth-child(2){animation-delay:.12s}.art>:nth-child(3){animation-delay:.24s}.art>:nth-child(4){animation-delay:.3s}}
@keyframes drop{from{transform:translateY(-40px) rotate(-25deg);opacity:0}}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px}
.chip{border:3px solid var(--fg);background:var(--card);padding:6px 14px;font-weight:700}
.chip b{font-weight:800}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:16px;color:var(--muted);margin-bottom:26px}
.legend i,.dot{display:inline-block;width:14px;height:14px;background:var(--c);border:2px solid var(--fg);margin-right:6px;vertical-align:-1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-bottom:40px}
.tile{background:var(--b);color:var(--t);border:3px solid var(--fg);box-shadow:6px 6px 0 var(--fg);padding:18px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:158px}
.tile:active,.opt:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--fg)}
.tile h3{font-size:30px;font-weight:800;letter-spacing:-.01em}
.tile p{font-size:17px;flex:1}
.stars{display:flex;gap:6px;align-items:center}
.sh{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:3}
.sh.on{fill:var(--c)}
.tile .sh{stroke:var(--t)}
.tile .sh.on{fill:var(--t)}
h2{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 14px}
.verbs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-bottom:34px}
.verb{border:3px solid var(--fg);background:var(--card);padding:14px 16px}
.verb h3{font-size:28px;font-weight:800}
.verb .pt{color:var(--muted);margin-bottom:8px}
.verb .conj{font-size:17px}
.verb .ex{margin-top:10px;padding-top:8px;border-top:3px solid var(--fg);font-weight:700}
.phr{list-style:none;padding:0;margin:0 0 20px;border-top:3px solid var(--fg)}
.phr li{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:3px solid var(--fg)}
.phr div{flex:1}.phr b{font-size:21px;font-weight:700;display:block}.phr span{color:var(--muted);font-size:17px}
.snd,.snd2,.ghost{border:3px solid var(--fg);background:var(--card);padding:6px 12px;font-weight:700}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.hearts{display:flex;gap:8px}
.hearts i{width:22px;height:22px;border-radius:50%;border:3px solid var(--fg)}
.hearts i.on{background:var(--caju)}
.prog{height:12px;border:3px solid var(--fg);margin-bottom:20px}
.prog span{display:block;height:100%;background:var(--sun);transition:width .3s}
.q{border:3px solid var(--fg);background:var(--card);padding:24px 18px;text-align:center;margin-bottom:18px;display:flex;flex-direction:column;align-items:center;gap:10px;min-height:190px;justify-content:center}
.q .big{font-size:clamp(38px,9vw,58px);font-weight:800;letter-spacing:-.02em;line-height:1.1}
.q .mid{font-size:clamp(26px,6vw,38px);font-weight:800;line-height:1.2}
.q .em{font-size:64px;line-height:1}
.q .sub{color:var(--muted)}
.sw{width:110px;height:110px;border-radius:50%;border:4px solid var(--fg)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.opt{border:3px solid var(--fg);background:var(--card);box-shadow:4px 4px 0 var(--fg);padding:14px;font-size:21px;font-weight:700;text-align:center}
.opt.ok{background:var(--leaf);color:#fff}
.opt.no{background:var(--caju);color:#fff}
.opt:disabled{cursor:default;opacity:1}
.opt:disabled:not(.ok):not(.no){opacity:.55}
.fb{margin-top:20px;border:3px solid var(--fg);border-left-width:14px;padding:12px 16px;background:var(--card)}
.fb.ok{border-left-color:var(--leaf)}.fb.no{border-left-color:var(--caju)}
.fb b{font-size:22px;font-weight:800;display:block}
.go{display:block;margin-top:12px;background:var(--fg);color:var(--bg);border:3px solid var(--fg);padding:10px 22px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px;margin-top:6px}
.fcw{position:relative}
.fc{width:100%;min-height:170px;border:3px solid var(--fg);border-top:14px solid var(--c);background:var(--card);padding:14px 10px 10px;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.fc .e{font-size:44px;line-height:1}.fc .ru{font-size:24px;font-weight:800}
.fc .back{display:none;font-size:16px}
.fc.on .back{display:block}.fc.on .e{display:none}
.fc .back i{display:block;color:var(--muted)}.fc .back strong{font-size:20px;display:block}
.fcw .snd{position:absolute;right:6px;bottom:6px;padding:2px 8px;font-size:15px}
.end{text-align:center;padding:20px 0}
.end .stars{justify-content:center;margin:14px 0}.end .sh{width:56px;height:56px}
.end h2{font-size:44px}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.row .go{margin:0}.row .ghost{padding:10px 22px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const app=document.getElementById("app");
const W=[["рубашка","rubáshka","camisa","👔","f"],["футболка","futbólka","camiseta","👕","f"],["свитер","svíter","suéter","🧶","m"],["куртка","kúrtka","jaqueta","🧥","f"],["пальто","pal’tó","casaco longo","🧥","n"],["платье","plát’ye","vestido","👗","n"],["брюки","brýuki","calça","👖","p"],["джинсы","dzhínsy","jeans","👖","p"],["шорты","shórty","short","🩳","p"],["носки","naskí","meias","🧦","p"],["туфли","túfli","sapatos","👞","p"],["кроссовки","krossóvki","tênis","👟","p"],["сапоги","sapogí","botas","🥾","p"],["шарф","sharf","cachecol","🧣","m"],["перчатки","perchátki","luvas","🧤","p"],["шляпа","shlyápa","chapéu","👒","f"],["кепка","képka","boné","🧢","f"],["очки","ochkí","óculos","👓","p"],["сумка","súmka","bolsa","👜","f"]].map(([ru,tr,pt,e,g])=>({ru,tr,pt,e,g}));
const C=[["красн","vermelho","#E03A2F"],["син","azul","#1F46A8",1],["зелён","verde","#2E9E4F"],["жёлт","amarelo","#F5B820"],["чёрн","preto","#141414"],["бел","branco","#FFFFFF"],["сер","cinza","#8A8A8A"],["оранжев","laranja","#F28C1B"],["розов","rosa","#F08CB4"],["коричнев","marrom","#7A4A2B"]].map(([s,pt,hex,soft])=>({s,pt,hex,soft}));
const END={hard:{m:"ый",f:"ая",n:"ое",p:"ые"},soft:{m:"ий",f:"яя",n:"ее",p:"ие"}};
const form=(c,g)=>c.s+(c.soft?END.soft:END.hard)[g];
const GC={m:"var(--blue)",f:"var(--caju)",n:"var(--sun)",p:"var(--fg)"};
const GN={m:"мужской род",f:"женский род",n:"средний род",p:"мн. число"};
const RANKS=[[0,"Новичок","iniciante"],[100,"Ученик","aprendiz"],[250,"Знаток","conhecedora"],[500,"Мастер","mestra"]];
const SH=['<circle cx="20" cy="20" r="17"/>','<rect x="3" y="3" width="34" height="34"/>','<path d="M20 3 37 37H3Z"/>'];
const SC=["var(--caju)","var(--sun)","var(--blue)"];
const MODES={w:["Слова","Выбери перевод: с русского и на русский.","var(--sun)","#141414"],c:["Цвета","Цвета и согласование: красная футболка, красный свитер.","var(--blue)","#fff"],v:["Одеваться и носить","надевать, носить, одеваться и фразы на каждый день.","var(--fg)","var(--bg)"]};
let S={xp:0,best:0,stars:{},seen:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem("rizoma-ru-roupas")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("rizoma-ru-roupas",JSON.stringify(S))}catch(e){}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const sample=(a,n)=>shuffle(a).slice(0,n);
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="ru-RU";u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
const shapes=n=>[0,1,2].map(k=>`<svg class="sh ${k<n?"on":""}" style="--c:${SC[k]}" viewBox="0 0 40 40" aria-hidden="true">${SH[k]}</svg>`).join("");
const rank=()=>{let r=RANKS[0],nx=null;for(const x of RANKS)if(S.xp>=x[0])r=x;nx=RANKS[RANKS.indexOf(r)+1];return{r,nx}};

function home(){
 const {r,nx}=rank();
 app.innerHTML=`
 <div class="brand"><span>Rizoma</span><span>Русский язык</span></div>
 <header class="hero">
  <svg class="art" viewBox="0 0 220 190" aria-hidden="true">
   <circle cx="72" cy="100" r="62" fill="var(--caju)"/>
   <rect x="100" y="14" width="96" height="96" fill="var(--blue)"/>
   <path d="M112 178 166 84 220 178Z" fill="var(--sun)"/>
   <path d="M44 56C52 24 96 22 106 50 92 42 66 42 44 56Z" fill="var(--fg)"/>
  </svg>
  <div><h1>Одежда</h1><p>Одежда по-русски. Играй, слушай и получай баллы.</p></div>
 </header>
 <div class="stats">
  <div class="chip">Баллы: <b>${S.xp}</b></div>
  <div class="chip">${r[1]}</div>
  <div class="chip">${nx?`До уровня «${nx[1]}»: <b>${nx[0]-S.xp}</b>`:"Высший уровень!"}</div>
 </div>
 <div class="legend"><span>Цвет = род слова:</span>${Object.keys(GN).map(g=>`<span><i style="--c:${GC[g]}"></i>${GN[g]}</span>`).join("")}</div>
 <div class="tiles">
  <button class="tile" style="--b:var(--caju);--t:#fff" onclick="cards()"><h3>Карточки</h3><p>Переверни карточку, послушай и запомни ${W.length} слов.</p><span>Просмотрено: ${Object.keys(S.seen).length} из ${W.length}</span></button>
  ${Object.entries(MODES).map(([k,m])=>`<button class="tile" style="--b:${m[2]};--t:${m[3]}" onclick="start('${k}')"><h3>${m[0]}</h3><p>${m[1]}</p><span class="stars">${shapes(S.stars[k]||0)}</span></button>`).join("")}
 </div>
 <h2>Три глагола про одежду</h2>
 <div class="verbs">
  <div class="verb"><h3>надевать</h3><p class="pt">colocar uma peça no corpo</p><p class="conj">я надеваю<br>ты надеваешь<br>он надевает</p><p class="ex">Я надеваю куртку.</p></div>
  <div class="verb"><h3>носить</h3><p class="pt">usar, andar vestido com (hábito)</p><p class="conj">я ношу<br>ты носишь<br>она носит</p><p class="ex">Я ношу джинсы.</p></div>
  <div class="verb"><h3>одеваться</h3><p class="pt">vestir-se (sem objeto)</p><p class="conj">я одеваюсь<br>ты одеваешься<br>он одевается</p><p class="ex">Я одеваюсь.</p></div>
 </div>
 <h2>Полезные фразы</h2>
 <ul class="phr">${PH.map(([r,p])=>`<li><div><b>${r}</b><span>${p}</span></div><button class="snd" aria-label="Слушать" onclick="say('${r}')">🔊</button></li>`).join("")}</ul>`;
 window.scrollTo(0,0);
}
const PH=[["Что ты носишь?","O que você usa?"],["Я надеваю куртку.","Eu visto a jaqueta."],["Я ношу джинсы.","Eu uso jeans."],["Я одеваюсь.","Eu me visto."],["Какого цвета твоя куртка?","De que cor é a sua jaqueta?"],["Мне нравится эта футболка.","Eu gosto desta camiseta."],["У меня есть красная сумка.","Eu tenho uma bolsa vermelha."]];

function cards(){
 app.innerHTML=`<div class="bar"><button class="ghost" onclick="home()">← Меню</button><span>Нажми на карточку: увидишь перевод</span></div>
 <div class="legend">${Object.keys(GN).map(g=>`<span><i style="--c:${GC[g]}"></i>${GN[g]}</span>`).join("")}</div>
 <div class="grid">${W.map((w,i)=>`<div class="fcw"><button class="fc" style="--c:${GC[w.g]}" onclick="flip(this,${i})"><span class="e">${w.e}</span><b class="ru">${w.ru}</b><span class="back"><i>${w.tr}</i><strong>${w.pt}</strong>${GN[w.g]}</span></button><button class="snd" aria-label="Слушать ${w.ru}" onclick="say('${w.ru}')">🔊</button></div>`).join("")}</div>`;
 window.scrollTo(0,0);
}
function flip(b,i){b.classList.toggle("on");if(b.classList.contains("on")&&!S.seen[i]){S.seen[i]=1;S.xp+=2;save()}say(W[i].ru)}

function mk(right,wrongs){const o=shuffle([right,...wrongs]);return{o,a:o.indexOf(right)}}
function qW(){
 return sample(W,8).map((w,i)=>{
  const others=sample(W.filter(x=>x!==w),12);
  if(i%2==0){const wr=[];for(const x of others)if(wr.length<3&&x.pt!==w.pt)wr.push(x.pt);
   return{...mk(w.pt,wr),top:`<div class="big">${w.ru}</div><div class="sub">${w.tr}</div>`,say:w.ru,x:`${w.e} ${w.ru} (${w.tr}) = ${w.pt}`}}
  const wr=[];for(const x of others)if(wr.length<3&&x.ru!==w.ru)wr.push(x.ru);
  return{...mk(w.ru,wr),top:`<div class="em">${w.e}</div><div class="mid">${w.pt}</div>`,say:w.ru,x:`${w.e} ${w.pt} = ${w.ru} (${w.tr})`}
 });
}
function qC(){
 const out=[];
 sample(C,3).forEach(c=>{const wr=sample(C.filter(x=>x!==c),3).map(x=>form(x,"m"));
  out.push({...mk(form(c,"m"),wr),top:`<div class="sw" style="background:${c.hex}"></div><div class="sub">Какой это цвет?</div>`,x:`${form(c,"m")} = ${c.pt}`})});
 sample(W,5).forEach(w=>{const c=C[Math.floor(Math.random()*C.length)];const fs=["m","f","n","p"].map(g=>form(c,g));
  const r=form(c,w.g);
  out.push({...mk(r,fs.filter(f=>f!==r)),top:`<div class="em">${w.e}</div><div class="big">___ ${w.ru}</div><div class="sub">${c.pt}, ${GN[w.g]}</div>`,say:`${r} ${w.ru}`,
   x:`<span class="dot" style="--c:${GC[w.g]}"></span>${w.ru}: ${GN[w.g]}, значит: <b>${r} ${w.ru}</b>`})});
 return shuffle(out);
}
function qV(){
 const B=[
  {top:"Утром я ___ куртку.",c:"надеваю",w:["ношу","одеваюсь"],pt:"De manhã eu visto a jaqueta.",x:"надевать = colocar uma peça no corpo."},
  {top:"Я ___ быстро.",c:"одеваюсь",w:["надеваю","ношу"],pt:"Eu me visto rápido.",x:"одеваться = vestir-se. После глагола нет предмета."},
  {top:"Она всегда ___ очки.",c:"носит",w:["одевается","одеваю"],pt:"Ela sempre usa óculos.",x:"носить = usar, por hábito. Она → носит."},
  {top:"У меня ___ красная сумка.",c:"есть",w:["нет","это"],pt:"Eu tenho uma bolsa vermelha.",x:"У меня есть = eu tenho."},
  {top:"Мой папа не ___ шляпу.",c:"носит",w:["одевается","одеваюсь"],pt:"Meu pai não usa chapéu.",x:"носить = usar. Мой папа → носит."},
  {top:"Какого цвета твоя куртка?",c:"De que cor é a sua jaqueta?",w:["Onde está a sua jaqueta?","Quanto custa a jaqueta?"],pt:"",x:"Какого цвета? = De que cor?",say:"Какого цвета твоя куртка?"},
  {top:"Мне нравится эта футболка.",c:"Eu gosto desta camiseta.",w:["Eu preciso de uma camiseta.","Esta camiseta é nova."],pt:"",x:"Мне нравится = eu gosto, me agrada.",say:"Мне нравится эта футболка."},
  {top:"Что ты носишь?",c:"O que você usa?",w:["Quem é você?","Onde você mora?"],pt:"",x:"Что = o que. носишь = você usa.",say:"Что ты носишь?"}];
 return shuffle(B).map(b=>({...mk(b.c,b.w),top:`<div class="mid">${b.top}</div>`,say:b.say,x:b.x+(b.pt?` <br>${b.pt}`:"")}));
}

let G=null;
function start(m){G={m,qs:m=="w"?qW():m=="c"?qC():qV(),i:0,h:3,ok:0,xp:0,st:0,mx:0,done:false};play()}
function play(){
 const q=G.qs[G.i];
 app.innerHTML=`<div class="bar"><button class="ghost" onclick="home()">← Меню</button><div class="hearts" aria-label="Жизни: ${G.h}">${[0,1,2].map(k=>`<i class="${k<G.h?"on":""}"></i>`).join("")}</div></div>
 <div class="prog"><span style="width:${G.i/G.qs.length*100}%"></span></div>
 <section class="q">${q.top}${q.say?`<button class="snd2 snd" onclick="say('${q.say}')">🔊 Слушать</button>`:""}</section>
 <div class="opts">${q.o.map((t,k)=>`<button class="opt" onclick="pick(${k})">${t}</button>`).join("")}</div><div id="fb"></div>`;
 window.scrollTo(0,0);
}
function pick(k){
 if(G.done)return;G.done=true;
 const q=G.qs[G.i],good=k==q.a,bs=document.querySelectorAll(".opt");
 bs.forEach((b,j)=>{b.disabled=true;if(j==q.a)b.classList.add("ok");else if(j==k)b.classList.add("no")});
 let msg;
 if(good){G.ok++;G.st++;G.mx=Math.max(G.mx,G.st);const g=10+(G.st>=3?5:0);G.xp+=g;S.xp+=g;msg=`Верно! +${g}`+(G.st>=3?` (серия: ${G.st})`:"")}
 else{G.h--;G.st=0;msg="Ещё раз!"}
 S.best=Math.max(S.best,G.mx);save();
 if(q.say&&good)say(q.say);
 const last=G.i+1>=G.qs.length||G.h<=0;
 document.getElementById("fb").innerHTML=`<div class="fb ${good?"ok":"no"}" role="status"><b>${msg}</b><span>${q.x}</span><button class="go" onclick="nextQ()">${last?"Результат":"Дальше"}</button></div>`;
 document.querySelector(".hearts").innerHTML=[0,1,2].map(j=>`<i class="${j<G.h?"on":""}"></i>`).join("");
 document.querySelector(".go").focus();
}
function nextQ(){G.i++;if(G.i>=G.qs.length||G.h<=0)return end();G.done=false;play()}
function end(){
 const n=G.ok>=8?3:G.ok>=6?2:G.ok>=4?1:0;
 S.stars[G.m]=Math.max(S.stars[G.m]||0,n);save();
 const t=n==3?"Отлично!":n==2?"Хорошо!":n==1?"Неплохо!":"Попробуй ещё раз!";
 app.innerHTML=`<div class="end"><h2>${t}</h2><div class="stars">${shapes(n)}</div><p>Правильных ответов: ${G.ok} из ${G.qs.length}. Баллы: +${G.xp}</p>
