<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rizoma · Le jeu du français familier</title>
<style>
:root{--bg:#F3EAD7;--ink:#1A1A1A;--red:#E5401B;--yel:#F4B323;--grn:#2E6B4E;--card:#FFF8E8;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171513;--ink:#F3EAD7;--card:#26211C}}
:root[data-theme="dark"]{--bg:#171513;--ink:#F3EAD7;--card:#26211C}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Futura","Century Gothic","Trebuchet MS",Arial,sans-serif;min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;gap:14px;border-bottom:6px solid var(--ink);padding-bottom:12px;margin-bottom:16px}
header h1{margin:0;font-size:30px;letter-spacing:.14em;text-transform:uppercase;line-height:1}
header p{margin:4px 0 0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:700}
.ink{fill:var(--ink)}
.lead{font-size:15px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--ink);box-shadow:5px 5px 0 var(--ink);padding:12px;cursor:pointer}
.tile:active,.opt:active,.btn:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
.tile b{font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.tile small{font-size:12px;opacity:.8}
.best{font-size:13px;margin-top:16px;font-weight:700}
.top{display:flex;justify-content:space-between;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin-bottom:8px}
.bar{height:12px;border:3px solid var(--ink);background:var(--card);margin-bottom:14px}
.bar i{display:block;height:100%;width:100%;background:var(--yel);transition:width .1s linear}
.card{background:var(--card);border:3px solid var(--ink);box-shadow:6px 6px 0 var(--red);padding:18px;margin-bottom:18px}
.card small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--red);font-weight:700;margin-bottom:8px}
.q{font-size:22px;line-height:1.35;font-weight:700}
.w{font-size:30px}
.gap{display:inline-block;min-width:80px;border-bottom:4px solid var(--red)}
.opts{display:grid;gap:10px}
.opt,.btn{font:inherit;font-size:16px;font-weight:700;color:var(--ink);text-align:left;border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 14px;cursor:pointer;background:var(--card)}
.c0{border-left:14px solid var(--red)}.c1{border-left:14px solid var(--yel)}.c2{border-left:14px solid var(--grn)}.c3{border-left:14px solid var(--ink)}
.opt.ok{background:var(--grn);color:#fff}
.opt.ko{background:var(--red);color:#fff}
.opt:disabled{cursor:default}
#fb{margin-top:16px;font-size:15px}
#fb .msg{border:3px solid var(--ink);background:var(--yel);color:#1A1A1A;padding:10px 12px;margin-bottom:10px;font-weight:700}
.btn{background:var(--ink);color:var(--bg);text-align:center;text-transform:uppercase;letter-spacing:.08em;width:100%}
.btn.alt{background:var(--card);color:var(--ink);margin-top:10px}
.score{font-size:64px;font-weight:900;line-height:1;color:var(--red)}
.title{font-size:22px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin:8px 0 14px}
ul.miss{padding-left:18px;margin:8px 0 18px;font-size:14px;line-height:1.6}
</style></head>
<body><div class="wrap">
<header>
<svg viewBox="0 0 56 56" width="56" height="56" aria-hidden="true"><circle cx="24" cy="26" r="20" fill="#E5401B"/><path class="ink" d="M36 38c10-2 16 4 12 12-5 3-14 0-12-12Z"/><rect x="4" y="4" width="14" height="14" fill="#F4B323"/><path d="M40 4 52 4 46 16Z" fill="#2E6B4E"/></svg>
<div><h1>Rizoma</h1><p>Le jeu du français familier</p></div>
</header>
<main id="app"></main>
</div>
<script>
const P=s=>s.split(";").map(x=>x.split("~"));
const D={
V:P("kiffer~aimer;bouffer~manger;picoler~boire;roupiller~dormir;tchatcher~parler;s’engueuler~se disputer;chialer~pleurer;bouquiner~lire;bidouiller~bricoler, fabriquer;se casser~partir;se grouiller~se dépêcher;s’éclater~s’amuser;se marrer~rire;se planter~se tromper;louper~rater;paumer~perdre;virer~licencier / se débarrasser de;glander~ne rien faire;frimer~se vanter;chlinguer~puer;filer~prêter, donner;piger~comprendre;flipper~avoir peur;piquer~voler;taffer~travailler"),
N:P("un gamin~un enfant;un ado~un adolescent;un mec~un homme;une nana~une femme;un frangin~un frère;un pote~un copain;un cuistot~un cuisinier;un flic~un policier;un toubib~un médecin;un coloc~un colocataire;un mytho~un menteur;une teuf~une fête;une baraque~une maison;une piaule~une chambre;les chiottes~les toilettes;un truc~une chose;une bagnole~une voiture;une bécane~une moto;des fringues~des vêtements;des pompes~des chaussures;un bouquin~un livre;un flingue~un pistolet;des médocs~des médicaments;une clope~une cigarette;le fric~l’argent;le taf~le travail;une boîte~une entreprise;un bahut~un collège;un exo~un exercice"),
A:P("nickel~parfait(e);sympa~sympathique;emballé(e)~ravi(e), enthousiaste;rigolo(te)~amusant(e);chou(te)~mignon(ne);canon~beau / belle;veinard(e)~chanceux(se);friqué(e)~riche;fauché(e)~sans argent / pauvre;chérot~cher (chère);chelou~bizarre;dingue~fou / folle;bourré(e)~ivre;hallucinant(e)~extraordinaire;dégueulasse~dégoûtant(e);con(ne)~stupide;froussard(e)~peureux(se);chiant(e)~énervant(e), ennuyant(e);lourd(e)~pénible;naze~nul(le);crevé(e)~fatigué(e);fichu(e)~détruit(e), cassé(e), gâché(e);ringard(e)~démodé(e);bidon~faux / fausse;crade~sale"),
E:P("J’ai la trouille.~J’ai peur.;J’ai la dalle.~J’ai faim.;Fais gaffe !~Fais attention !;Laisse tomber.~Abandonne ça.;Je suis crevé(e).~Je suis très fatigué(e).;J’en ai marre.~J’en ai assez.;Elle me casse les pieds.~Elle m’énerve.;Il pète un câble.~Il perd le contrôle de lui-même.;Tu me rends fou.~Tu m’énerves.;Il fait du cinéma.~Il fait des caprices.;Sans blague !~Ça ne peut pas être vrai !;Mon œil !~Je ne te crois pas !;Tu rigoles ou quoi ?~C’est vrai ? Tu es sérieux(se) ?;Pas vrai !~Je n’y crois pas !;Tu m’as tué(e) !~Tu m’as fait beaucoup rire.;Je m’en fiche.~Ça ne m’intéresse pas.;C’est pas mon truc.~Je n’aime pas trop ça.;C’est n’importe quoi !~C’est stupide !;Quel bordel !~Quelle confusion !;Ça craint.~C’est risqué / c’est nul, mauvais.;T’es dans la merde !~Tu as un problème.;Tu t’en sors ?~Tu te débrouilles ?;C’est parti !~On commence.;Occupe-toi de tes oignons !~Occupe-toi de tes affaires !;Y’a pas le feu.~On ne doit pas se dépêcher.;Ça bosse dur.~On travaille intensivement / beaucoup.;Ça déchire !~C’est super !")
};
const F=[
["Il est super tard ! Je dois me ___.","grouiller",["marrer","planter","engueuler"]],
["Tu as vu la ___ de Philippe ? Elle roule super vite !","bécane",["piaule","baraque","clope"]],
["Mon père est médecin : c’est un ___.","toubib",["flic","cuistot","mytho"]],
["Je n’ai plus un sou, je suis ___.","fauché",["friqué","veinard","canon"]],
["Ce film est ennuyeux et sans intérêt : il est ___.","naze",["nickel","rigolo","chou"]],
["Tu as gagné à la loterie ? Tu es ___ !","veinard",["crevé","froussard","crade"]],
["Ils crient l’un sur l’autre : ils s’___ encore.","engueulent",["éclatent","marrent","kiffent"]],
["Arrête de te vanter, ne ___ pas !","frime",["chiale","roupille","bouquine"]],
["Ta chambre est dégoûtante : elle est ___.","crade",["nickel","chou","canon"]],
["Moi, je n’ai pas peur, mais lui, il ___ à chaque orage.","flippe",["roupille","taffe","bouquine"]]];
const NAMES={V:"Verbes",N:"Noms",A:"Adjectifs",E:"Expressions",M:"Mix total",F:"Phrases à trous"};
const SUB={V:"kiffer, bouffer…",N:"un pote, la bagnole…",A:"nickel, chelou…",E:"Ça déchire !",M:"Tout mélangé",F:"Complète la phrase"};
const SH={V:'<circle cx="20" cy="20" r="16" fill="#E5401B"/>',N:'<rect x="5" y="5" width="30" height="30" fill="#F4B323"/>',A:'<path d="M20 4 36 36H4Z" fill="#2E6B4E"/>',E:'<path d="M4 30a16 16 0 0 1 32 0Z" fill="#E5401B"/>',M:'<circle cx="14" cy="14" r="9" fill="#E5401B"/><rect x="18" y="18" width="18" height="18" fill="#F4B323"/>',F:'<path class="ink" d="M20 3 37 20 20 37 3 20Z"/>'};
const $=s=>document.querySelector(s);
const sh=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
let mode,qs,i,score,streak,wrong,ok,left,timer,locked,best=0;

function menu(){
$("#app").innerHTML=`<p class="lead">Choisis ton terrain de jeu : 10 questions, 12 secondes chacune. Plus tu réponds vite, plus tu marques.</p><div class="grid">${Object.keys(NAMES).map(k=>`<button class="tile" data-k="${k}"><svg viewBox="0 0 40 40" width="40" height="40">${SH[k]}</svg><b>${NAMES[k]}</b><small>${SUB[k]}</small></button>`).join("")}</div><p class="best">${best?"Meilleur score : "+best+" pts":""}</p>`;
document.querySelectorAll(".tile").forEach(b=>b.onclick=()=>start(b.dataset.k));
}
function start(k){
mode=k;let q=[];
if(k=="F"){q=sh(F).map(f=>({t:"f",s:f[0],a:f[1],o:sh([f[1],...f[2]])}))}
else{
const pool=k=="M"?["V","N","A","E"].flatMap(c=>D[c].map(p=>[c,p])):D[k].map(p=>[k,p]);
q=sh(pool).slice(0,10).map(([c,p])=>{
const rev=c!="E"&&Math.random()<.35,f=rev?1:0,t=rev?0:1;
const others=sh(D[c].filter(x=>x[t]!=p[t])).slice(0,3).map(x=>x[t]);
return{t:"w",q:p[f],a:p[t],rev,p,o:sh([p[t],...others])};});
}
qs=q;i=0;score=0;streak=0;wrong=[];ok=0;ask();
}
function ask(){
const q=qs[i];left=12;locked=false;
const lab=q.t=="f"?"Complète la phrase":q.rev?"Comment dit-on en familier ?":"Que veut dire… ?";
const body=q.t=="f"?q.s.replace("___",'<span class="gap">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</span>'):`<span class="w">${q.q}</span>`;
$("#app").innerHTML=`<div class="top"><span>${NAMES[mode]} · ${i+1}/10</span><span>${score} pts${streak>1?" · série ×"+streak:""}</span></div><div class="bar"><i id="bar"></i></div><div class="card"><small>${lab}</small><div class="q">${body}</div></div><div class="opts">${q.o.map((o,j)=>`<button class="opt c${j}" data-j="${j}">${o}</button>`).join("")}</div><div id="fb"></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
clearInterval(timer);
timer=setInterval(()=>{left-=.1;const b=$("#bar");if(b)b.style.width=Math.max(0,left/12*100)+"%";if(left<=0)answer(-1)},100);
}
function answer(j){
if(locked)return;locked=true;clearInterval(timer);
const q=qs[i],good=j>=0&&q.o[j]==q.a;
document.querySelectorAll(".opt").forEach((b,n)=>{b.disabled=true;if(q.o[n]==q.a)b.classList.add("ok");else if(n==j)b.classList.add("ko")});
let msg;
if(good){streak++;ok++;const pts=100+Math.round(Math.max(0,left)*10);score+=pts;msg=`C’est ça ! +${pts} pts`}
else{streak=0;wrong.push(q);msg=j<0?"Temps écoulé !":"Pas tout à fait."}
const exp=q.t=="f"?q.s.replace("___","<u>"+q.a+"</u>"):(q.p[0]+" = "+q.p[1]);
$("#fb").innerHTML=`<div class="msg">${msg}</div><p>${exp}</p><button class="btn" id="nx">${i<qs.length-1?"Suivant":"Voir mon résultat"}</button>`;
$("#nx").onclick=()=>{i++;i<qs.length?ask():end()};
}
function end(){
best=Math.max(best,score);
const pc=ok/qs.length*100;
const t=pc>=90?"Caju mûr à point : nickel !":pc>=70?"Sympa ! Tu t’éclates bien":pc>=40?"Ça progresse, continue":"Pas de panique : on rejoue !";
$("#app").innerHTML=`<div class="card"><small>${NAMES[mode]}</small><div class="score">${score}</div><div class="title">${t}</div><p>${ok} bonne${ok>1?"s":""} réponse${ok>1?"s":""} sur ${qs.length}</p>${wrong.length?`<b>À revoir :</b><ul class="miss">${wrong.map(q=>"<li>"+(q.t=="f"?q.s.replace("___","<u>"+q.a+"</u>"):q.p[0]+" = "+q.p[1])+"</li>").join("")}</ul>`:"<p><b>Zéro faute. Ça déchire !</b></p>"}</div><button class="btn" id="re">Rejouer</button><button class="btn alt" id="mn">Changer de terrain</button>`;
$("#re").onclick=()=>start(mode);$("#mn").onclick=menu;
}
menu();
</script></body></html>
