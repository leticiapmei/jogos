<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rizoma · Jogos</title>
<meta name="description" content="Todos os jogos e atividades da Rizoma, Ateliê de Linguagem, num só lugar.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EAD7; --card:#FFF8E8; --ink:#1A1A1A; --muted:#5A554B; --line:#1A1A1A;
  --red:#E5401B; --yel:#F4B323; --grn:#2E6B4E; --blu:#1F4E9C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#171513; --card:#221F1B; --ink:#F3EAD7; --muted:#B9B0A0; --line:#F3EAD7;
  }
}
:root[data-theme="dark"]{ --bg:#171513; --card:#221F1B; --ink:#F3EAD7; --muted:#B9B0A0; --line:#F3EAD7; }

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}

header{padding:56px 0 28px;position:relative;overflow:hidden}
.brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px}
.brand svg{width:34px;height:34px}
h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(42px,8vw,88px);line-height:.95;margin:18px 0 14px;letter-spacing:-.02em}
h1 em{font-style:normal;color:var(--red)}
.lead{font-size:clamp(17px,2.2vw,20px);max-width:620px;color:var(--muted);margin:0}

.filters{display:flex;flex-wrap:wrap;gap:8px;margin:28px 0 8px}
.chip{font:inherit;font-weight:700;font-size:15px;padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.search{flex:1 1 220px;min-width:0;font:inherit;font-size:15px;padding:9px 16px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
.search::placeholder{color:var(--muted)}

.lang-title{font-family:"Bricolage Grotesque",sans-serif;font-size:28px;font-weight:800;margin:40px 0 16px;display:flex;align-items:center;gap:12px}
.lang-title .count{font-family:"DM Sans";font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--yel);color:#1A1A1A}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:20px;text-decoration:none;color:inherit;box-shadow:5px 5px 0 var(--line);transition:transform .15s, box-shadow .15s}
.card:hover,.card:focus-visible{transform:translate(-3px,-3px);box-shadow:8px 8px 0 var(--line);outline:none}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px}
.emoji{font-size:34px;line-height:1;width:58px;height:58px;display:grid;place-items:center;border-radius:14px;border:2px solid var(--line)}
.level{font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;border:2px solid var(--line);white-space:nowrap}
.card h3{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;line-height:1.15;margin:0 0 8px;font-weight:700}
.card p{margin:0 0 16px;color:var(--muted);font-size:15px;flex:1}
.play{font-weight:700;font-size:15px;display:inline-flex;align-items:center;gap:6px}
.card:hover .play{color:var(--red)}

.c-red .emoji{background:var(--red)} .c-yel .emoji{background:var(--yel)} .c-grn .emoji{background:var(--grn)} .c-blu .emoji{background:var(--blu)}

.empty{display:none;padding:40px 0;color:var(--muted);font-size:18px}
footer{margin:64px 0 0;padding:28px 0 40px;border-top:2px solid var(--line);font-size:14px;color:var(--muted);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}

.blob{position:absolute;right:-60px;top:20px;width:300px;height:300px;opacity:.9;pointer-events:none}
@media (max-width:700px){.blob{width:180px;height:180px;right:-70px;top:0;opacity:.5} header{padding-top:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="blob" viewBox="0 0 200 200" aria-hidden="true">
      <g fill="none" stroke="var(--ink)" stroke-width="3" stroke-linecap="round">
        <path d="M100 100 C70 60 40 70 25 40"/><path d="M100 100 C140 70 150 40 180 30"/>
        <path d="M100 100 C90 140 60 150 40 180"/><path d="M100 100 C140 130 160 160 175 175"/>
        <path d="M60 68 C70 50 80 40 75 18"/><path d="M146 58 C160 70 175 80 195 82"/>
      </g>
      <circle cx="100" cy="100" r="14" fill="var(--red)"/><circle cx="25" cy="40" r="9" fill="var(--yel)"/>
      <circle cx="180" cy="30" r="9" fill="var(--grn)"/><circle cx="40" cy="180" r="9" fill="var(--blu)"/>
      <circle cx="175" cy="175" r="9" fill="var(--yel)"/><circle cx="75" cy="18" r="6" fill="var(--red)"/>
      <circle cx="195" cy="82" r="6" fill="var(--red)"/>
    </svg>
    <div class="brand">
      <svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="18" fill="var(--red)"/><path d="M20 20 L8 10 M20 20 L32 9 M20 20 L12 32 M20 20 L31 30" stroke="#FFF8E8" stroke-width="3" stroke-linecap="round"/><circle cx="20" cy="20" r="4" fill="#FFF8E8"/></svg>
      Rizoma · Ateliê de Linguagem
    </div>
    <h1>Jogos para<br>aprender <em>brincando</em></h1>
    <p class="lead">Escolha uma atividade e comece por onde quiser. Como num rizoma, todo caminho leva a algum lugar.</p>

    <div class="filters" role="group" aria-label="Filtrar por língua">
      <button class="chip lg" data-f="all" aria-pressed="true">Todos</button>
      <button class="chip lg" data-f="fr" aria-pressed="false">Francês</button>
      <button class="chip lg" data-f="ru" aria-pressed="false">Russo</button>
    </div>
    <div class="filters" role="group" aria-label="Filtrar por nível" style="margin-top:0">
      <button class="chip lv" data-l="all" aria-pressed="true">Todos os níveis</button>
      <button class="chip lv" data-l="A1" aria-pressed="false">A1</button>
      <button class="chip lv" data-l="A2" aria-pressed="false">A2</button>
      <button class="chip lv" data-l="B1" aria-pressed="false">B1</button>
      <button class="chip lv" data-l="B2" aria-pressed="false">B2</button>
      <button class="chip lv" data-l="C1" aria-pressed="false">C1</button>
      <button class="chip lv" data-l="C2" aria-pressed="false">C2</button>
      <input class="search" type="search" placeholder="Procurar (ex.: B2, verbos, TCF)" aria-label="Procurar jogo">
    </div>
  </header>

  <main id="list"></main>
  <p class="empty" id="empty">Ainda não há jogos aqui. Em breve!</p>

  <footer>
    <span>Rizoma · Ateliê de Linguagem</span>
    <span id="total"></span>
  </footer>
</div>

<script>
// Para adicionar um jogo novo: copie uma linha, troque os dados e coloque o arquivo na pasta "jogos".
const JOGOS = [
  // Francês
  {lang:"fr", file:"cabinet-mind-a1.html",      title:"Cabinet Mind & Co",              level:"A1",    emoji:"🛋️", color:"yel", desc:"Você é psicólogo em Paris e o telefone toca. Marque consultas e converse em francês."},
  {lang:"fr", file:"defi-du-chef-a1-a2.html",   title:"Le Défi du Chef",                level:"A1→A2", emoji:"👨‍🍳", color:"red", desc:"Uma aula-jogo de 40 minutos na cozinha: mercado, partitivo, receitas e muito XP."},
  {lang:"fr", file:"conjugaison-b1.html",       title:"La conjugaison jusqu'au B1",     level:"B1",    emoji:"🌱", color:"grn", desc:"Lições, quiz e jogos do presente ao subjuntivo. Suba de nível conjugando."},
  {lang:"fr", file:"tcf-nuances-b2.html",       title:"Nuances en français",            level:"B2",    emoji:"🎨", color:"blu", desc:"Adjetivos, advérbios, sinônimos e antônimos para o TCF Canada. 15 minutos por dia."},
  {lang:"fr", file:"tcf-administration.html",   title:"Le Rhizome de l'administration", level:"B2–C1", emoji:"🏛️", color:"grn", desc:"Vocabulário da administração para o TCF Canada. Entre por qualquer nó e crie pontes."},
  {lang:"fr", file:"droit-en-jeu.html",         title:"Le droit en jeu",                level:"B2–C1", emoji:"⚖️", color:"red", desc:"Vocabulário jurídico: comece como estagiário e ganhe XP até virar especialista."},
  {lang:"fr", file:"francais-familier.html",    title:"Le jeu du français familier",    level:"B1+",   emoji:"💬", color:"yel", desc:"Gírias e expressões do francês do dia a dia, para entender os franceses de verdade."},
  {lang:"fr", file:"temps-du-passe-c1.html",    title:"Les temps du passé",             level:"C1",    emoji:"⏳", color:"blu", desc:"Guia visual dos oito tempos do passado, do imparfait ao passé surcomposé, com quiz."},
  {lang:"fr", file:"lexique-maya.html",         title:"Le lexique de Maya à la poupée", level:"C1",    emoji:"🖼️", color:"red", desc:"Vocabulário avançado para falar do quadro de Picasso (1938), com três exercícios."},
  {lang:"fr", file:"carnet-equitation.html",    title:"Carnet d'équitation",            level:"B1",    emoji:"🐎", color:"grn", desc:"Andaduras, equipamento, corpo do cavalo e as ordens do instrutor, antes de entrar no picadeiro."},
  // Russo
  {lang:"ru", file:"vid-glagola.html",          title:"Вид глагола",                    level:"A2",    emoji:"🔁", color:"red", desc:"Processo ou resultado? Quatro exercícios sobre o aspecto verbal e uma tarefa com a música «Наше лето»."},
  {lang:"ru", file:"odezhda-a1.html",           title:"Одежда · слова и фразы",         level:"A1+",   emoji:"👕", color:"yel", desc:"Roupas em russo: palavras e frases para descrever o que você veste."},
  {lang:"ru", file:"kino-a1.html",              title:"КИНО",                           level:"A1",    emoji:"🎸", color:"blu", desc:"Conheça a banda de Viktor Tsoi e o rock de Leningrado dos anos 80, com exercícios A1."},
];

const LANGS = {fr:"Francês", ru:"Russo"};
const list = document.getElementById("list");
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let filter = "all", query = "", level = "all";
const ORDER = ["A1","A2","B1","B2","C1","C2"];
function levels(j){ // "B2–C1" -> [B2,C1]; "A1→A2" -> [A1,A2]; "B1+" -> [B1]
  const m = j.level.match(/[ABC][12]/g) || [];
  if (m.length === 2){ const a = ORDER.indexOf(m[0]), b = ORDER.indexOf(m[1]); return ORDER.slice(a, b+1); }
  return m;
}

function render(){
  const q = query.trim().toLowerCase();
  let shown = 0, html = "";
  for (const [code, name] of Object.entries(LANGS)){
    if (filter !== "all" && filter !== code) continue;
    const items = JOGOS.filter(j => j.lang === code && (level === "all" || levels(j).includes(level)) && (!q || (j.title+" "+j.level+" "+j.desc).toLowerCase().includes(q)));
    if (!items.length) continue;
    shown += items.length;
    html += `<section><h2 class="lang-title">${name} <span class="count">${items.length}</span></h2><div class="grid">` +
      items.map(j => `<a class="card c-${j.color}" href="${j.file}">
        <div class="top"><span class="emoji" aria-hidden="true">${j.emoji}</span><span class="level">${esc(j.level)}</span></div>
        <h3>${esc(j.title)}</h3><p>${esc(j.desc)}</p><span class="play">Jogar →</span></a>`).join("") +
      `</div></section>`;
  }
  list.innerHTML = html;
  document.getElementById("empty").style.display = shown ? "none" : "block";
}
document.querySelectorAll(".chip.lg").forEach(b => b.addEventListener("click", () => {
  filter = b.dataset.f;
  document.querySelectorAll(".chip.lg").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));
document.querySelectorAll(".chip.lv").forEach(b => b.addEventListener("click", () => {
  level = b.dataset.l;
  document.querySelectorAll(".chip.lv").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
}));
document.querySelector(".search").addEventListener("input", e => { query = e.target.value; render(); });
document.getElementById("total").textContent = JOGOS.length + " jogos e atividades";
render();
</script>
</body>
</html>
